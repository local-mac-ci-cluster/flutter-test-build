# Workflow: Flutter demo — 验证 quickstart/templates/flutter.yml 新版（纯 run: 形态）
# =============================================================================
# 变更：移除 macrunara/setup-action 与 build-actions（Action 产品线已放弃、仓库已私有），
# 改用模板自带 Setup PATH 步骤 + 纯 run: 构建命令。
# 仓库只保留最小源码（pubspec/lib/test），平台脚手架由 `flutter create .` 现场重建。
# =============================================================================

name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-flutter:
    runs-on: [macos, arm64, macrunara]

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    steps:
      - uses: actions/checkout@v5

      # 模板 Step 2：预装工具进 PATH（替代原 setup-action）
      - name: Setup PATH
        run: |
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          flutter --version

      # 仓库特有：重建平台脚手架（仓库不含 ios/ android/ 目录）
      - name: Recreate platform scaffolding
        run: |
          git config --global --add safe.directory "$HOME/flutter" || true
          flutter create . --platforms ios,android --project-name flutter_test_build

      # 节点出口到 repo.maven.apache.org / plugins.gradle.org 被重置
      # （TLS handshake terminated），统一经 init.d 注入 aliyun 镜像；并直接改写
      # Flutter SDK flutter_tools/gradle 自带的 buildscript 仓库（init.d 对
      # includeBuild 内项目的 buildscript 覆盖不可靠，2026-11-24 实测
      # kotlin-gradle-plugin 2.2.21 从 repo.maven.apache.org 直连被掐）。
      # 节点出口修复（§7 N150 白名单部署）后本步骤可删除。
      - name: Setup Maven mirrors
        run: |
          bash .ci/scripts/setup-maven-mirrors.sh
          FG="$HOME/flutter/packages/flutter_tools/gradle/build.gradle.kts"
          if [ -f "$FG" ]; then
            sed -i '' -E 's#mavenCentral\(\)#maven { url = uri("https://maven.aliyun.com/repository/central") }\n        maven { url = uri("https://maven.aliyun.com/repository/gradle-plugin") }#g' "$FG"
            echo "patched flutter_tools buildscript:"
            grep -n -A2 "repositories" "$FG" | head -8
          fi

      # wrapper 保持 services.gradle.org（Squid 白名单内、android 仓库已验证秒下），
      # 但 all → bin：9.3.1-all.zip（~230MB）在 CDN 上会静默挂死；bin 版足够构建。
      # （腾讯镜像 mirrors.cloud.tencent.com 被 Squid 403，勿用；2026-11-23 实测）
      - name: Switch Gradle wrapper to bin
        run: |
          sed -i '' 's/gradle-9.3.1-all\.zip/gradle-9.3.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter Analyze & Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --info --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-products
          # APK 由 android/ 目录内直接 gradlew 产出（非 flutter build apk 路径）
          path: |
            build/ios/ipa/*.ipa
            android/app/build/outputs/apk/release/*.apk
