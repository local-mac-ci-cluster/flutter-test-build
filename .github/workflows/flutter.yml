# Workflow: Flutter demo — 验证 quickstart/templates/flutter.yml 新版（纯 run: 形态）
# =============================================================================
# 变更：移除 macrunara/setup-action 与 build-actions（Action 产品线已放弃、仓库已私有），
# 改用模板自带 Setup PATH 步骤 + 纯 run: 构建命令。
# 仓库只保留最小源码（pubspec/lib/test），平台脚手架由 `flutter create .` 现场重建。
# =============================================================================

name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-flutter:
    runs-on: [macos, arm64, macrunara]

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      PUB_HOSTED_URL: https://pub.flutter-io.cn
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    steps:
      - uses: actions/checkout@v5

      # 模板 Step 2：预装工具进 PATH（替代原 setup-action）
      - name: Setup PATH
        run: |
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Show Environment
        run: |
          echo "OS:   $(uname -s) $(uname -m)"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          flutter --version

      # 仓库特有：重建平台脚手架（仓库不含 ios/ android/ 目录）
      - name: Recreate platform scaffolding
        run: |
          git config --global --add safe.directory "$HOME/flutter" || true
          flutter create . --platforms ios,android --project-name flutter_test_build

      # 节点出口到 repo.maven.apache.org 被重置（TLS handshake terminated），
      # 新脚手架依赖无缓存会拉取失败；在 .kts 的 repositories 最前面插入
      # 阿里云镜像（原 action 的 maven mirrors 能力的纯 run: 替代）。
      # 节点出口修复后本步骤可删除（2026-11-23 记）
      - name: Prepend Maven mirrors (node egress workaround)
        run: |
          python3 - <<'PYEOF'
          import pathlib
          mirrors = ('            maven("https://maven.aliyun.com/repository/google")\n'
                     '            maven("https://maven.aliyun.com/repository/central")\n'
                     '            maven("https://maven.aliyun.com/repository/gradle-plugin")\n')
          # gradle wrapper 走腾讯镜像（services.gradle.org 直连会静默挂死）
          wp = pathlib.Path("android/gradle/wrapper/gradle-wrapper.properties")
          wt = wp.read_text()
          wt = wt.replace("services.gradle.org/distributions/", "mirrors.cloud.tencent.com/gradle/")
          wp.write_text(wt)
          print("wrapper:", [l for l in wt.splitlines() if "distributionUrl" in l])
          for f in ("android/settings.gradle.kts", "android/build.gradle.kts"):
              p = pathlib.Path(f)
              t = p.read_text()
              t = t.replace("repositories {", "repositories {\n" + mirrors)
              p.write_text(t)
              print("patched", f)
          PYEOF
          grep -A4 "repositories {" android/settings.gradle.kts | head -12

      - name: Flutter Analyze & Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build IPA (unsigned)
        run: flutter build ipa --release --no-codesign

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --info --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-products
          path: |
            build/ios/ipa/*.ipa
            build/app/outputs/flutter-apk/app-release.apk
