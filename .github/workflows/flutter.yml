# Workflow：Flutter demo 冒烟（基于 quickstart/templates/flutter.yml）
# =============================================================================
# 仓库只保留最小源码（pubspec/lib/test），平台脚手架（ios/ android/）
# 由 Step 3 的 `flutter create .` 在 CI 内现场重建——这是官方支持的模式。
#
# 冒烟期临时配置：job 级代理走 Windows 172.16.0.81:7890（pub.dev 依赖下载用，
# 生产切内网白名单后删除下面 env 块即可）。
# =============================================================================

name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-flutter:
    runs-on: [macos, arm64, macrunara]

    env:
      # --- 冒烟期临时：pub.dev 走 Windows 代理 ---
      http_proxy: http://172.16.0.81:7890
      https_proxy: http://172.16.0.81:7890

    steps:
      - uses: actions/checkout@v4

      # 可选：Macrunara Setup Action（需仓库 Secrets 配 MACRUNARA_INSTALLATION_ID；
      # 没配就删掉这个 step，不影响构建）
      - uses: macrunara/setup-action@v1
        with:
          installation-id: ${{ secrets.MACRUNARA_INSTALLATION_ID }}
          region: auto

      # Step 3: 重建平台脚手架（仓库不含 ios/ android/ 目录）
      # 此 step 在 action 之前，flutter 还没进 PATH，显式指定预装路径。
      - name: Recreate platform scaffolding
        run: |
          export PATH="$PATH:$HOME/flutter/bin"
          git config --global --add safe.directory "$HOME/flutter" || true
          flutter create . --platforms ios,android --project-name flutter_test_build

      # Step 4: 分析 + 测试 + 双端构建 + 上传
      - name: Flutter Build & Upload
        uses: macrunara/build-actions/flutter@v1
        with:
          platform: all
          build-mode: release
          run-tests: 'true'
          upload_artifact: true
          artifact_name: flutter-build-products
