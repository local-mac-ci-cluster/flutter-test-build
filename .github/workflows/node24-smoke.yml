name: node24-smoke
on: [push]
jobs:
  smoke:
    runs-on: [macos, arm64, macrunara]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: java -version && node --version
